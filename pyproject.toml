[project]
name = "socialrobot"
version = "0.1.0"
description = "Python SDK for the Social Robot Platform — build characters in code (Builder DSL) and drive live robots (Runtime client)."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24",
    "websockets>=11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["socialrobot*"]
