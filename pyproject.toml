[project]
name = "socialrobot"
version = "0.1.0"
description = "Python SDK for the Social Robot Platform — build characters in code (Builder DSL) and drive live robots (Runtime client)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hung-Chun Chang", email = "jonathanchang9@gmail.com" }]
keywords = ["social robot", "robotics", "wizard-of-oz", "woz", "kebbi", "nao", "hri", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.24",
    "websockets>=11",
]

[project.optional-dependencies]
dev = ["build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://sociallab.duckdns.org/ntu_social_robot/"
Repository = "https://github.com/hungchunchang/meme"
Issues = "https://github.com/hungchunchang/meme/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["socialrobot*"]

[tool.setuptools.package-data]
socialrobot = ["py.typed"]
